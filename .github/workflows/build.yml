name: Build and test captdriver
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        persistent: ["yes", "no"]
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake pkg-config libcups2-dev libcupsimage2-dev libusb-1.0-0-dev cups-ppdc python3
      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure --enable-persistent-usb=${{ matrix.persistent }}
          make -j2
          make ppd
      - name: Run hardware-free regression tests
        run: make check
      - name: Verify staged installation
        run: |
          make DESTDIR="$RUNNER_TEMP/capt-install" install
          test -x "$RUNNER_TEMP/capt-install$(cups-config --serverbin)/filter/rastertocapt"
          if [ "${{ matrix.persistent }}" = yes ]; then
            test -x "$RUNNER_TEMP/capt-install/usr/local/sbin/captd"
            test "$(stat -c %a "$RUNNER_TEMP/capt-install$(cups-config --serverbin)/backend/capt")" = 700
            grep -q '^ExecStart=/usr/local/sbin/captd ' "$RUNNER_TEMP/capt-install/usr/local/lib/systemd/system/captd.service"
          fi
